<video id="cam" autoplay playsinline muted></video> 
<canvas id="frame"></canvas>

<!-- Diperbaiki: mengirim elemen objek DOM langsung, bukan teks string -->
<button onclick="prosesFoto()">take photo</button>

<script>
mulaiKamera();
  
async function mulaiKamera() {
    const video = document.getElementById('cam');
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    await video.play();
    return video;
}

function ambilFrame(video, canvas) {
    const ctx = canvas.getContext('2d');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    return ctx.getImageData(0, 0, canvas.width, canvas.height);
}

// Hitung rata-rata kecerahan
function rataKecerahan(imageData) {
    const d = imageData.data;
    let total = 0;
    
    for (let i = 0; i < d.length; i += 4) {
        total += (d[i] + d[i + 1] + d[i + 2]) / 3;
    }
    
    return total / (d.length / 4);
}

// Tambahan fungsi kecil untuk menghubungkan tombol dengan fungsi yang kamu buat
function prosesFoto() {
    const video = document.getElementById('cam');
    const canvas = document.getElementById('frame');
    
    // Mengambil frame
    const imgData = ambilFrame(video, canvas);
    
    // Menghitung kecerahan (bisa dilihat di console browser)
    const hasil = rataKecerahan(imgData);
    console.log("Rata-rata Kecerahan:", hasil);
}
</script>
